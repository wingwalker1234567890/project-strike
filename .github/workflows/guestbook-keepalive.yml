# Reads the public guestbook every 3 days so the free Supabase project is not paused for inactivity.
name: Guestbook keep-alive
on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read approved guestbook rows
        run: |
          curl -fsS "https://ehykdhzwqzoajcgalviz.supabase.co/rest/v1/guestbook?select=id&limit=1" \
            -H "apikey: sb_publishable_nv64PUIE9nx4B4CmICGXwg_PfH5wEW2" \
            -H "Authorization: Bearer sb_publishable_nv64PUIE9nx4B4CmICGXwg_PfH5wEW2"
